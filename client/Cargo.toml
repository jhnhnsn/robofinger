[package]
name = "robofinger"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.11"
base64 = "0.22"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.3"
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.3.0", features = ["json"] }
