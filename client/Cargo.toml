[package]
name = "planrelay"
version = "0.1.0"
edition = "2024"

[dependencies]
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.3.0", features = ["json"] }
